events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;
    
    upstream frontend { server 127.0.0.1:3000; }
    upstream command_service { server 127.0.0.1:3001; }
    upstream query_service { server 127.0.0.1:3002; }

    server {
        listen 80;

        
        add_header X-Config-Version "v6-cqrs-active" always;

        
        location /_next/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /public/ {
            proxy_pass http://frontend;
        }
        
        
        location /complaints {
            
            client_max_body_size 50M;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            
            set $upstream_target command_service;

            
            if ($request_method = GET) {
                set $upstream_target query_service;
            }

            
            proxy_pass http://$upstream_target;
        }

        
        location /auth { 
            proxy_pass http://command_service;
            proxy_set_header Host $host;
        }

        location /users { 
            proxy_pass http://command_service;
            proxy_set_header Host $host;
        }

    
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}