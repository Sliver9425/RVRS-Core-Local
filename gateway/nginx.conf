events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;
    # Tus 3 microservicios locales
    upstream frontend { server 127.0.0.1:3000; }
    upstream command_service { server 127.0.0.1:3001; }
    upstream query_service { server 127.0.0.1:3002; }

    server {
        listen 80;

        # 🔥 Header actualizado para verificar el despliegue v5
        add_header X-Config-Version "v6-cqrs-active" always;

        # --- 1. REGLAS DE FRONTEND (Assets) ---
        location /_next/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /public/ {
            proxy_pass http://frontend;
        }
        
        # --- 2. APIS CON LOGICA CQRS (El cambio importante) ---
        
        # Rutas de Denuncias:
        # Si es GET -> Query Service (Puerto 3002)
        # Si es POST/PUT/DELETE -> Command Service (Puerto 3001)
        location /complaints {
            
            client_max_body_size 50M;
            # Headers necesarios para que el backend sepa quién llama
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Por defecto, asumimos que es escritura (Command)
            set $upstream_target command_service;

            # Si el método es GET (Lectura), cambiamos al Query Service
            if ($request_method = GET) {
                set $upstream_target query_service;
            }

            # Nginx enviará la petición al destino elegido
            proxy_pass http://$upstream_target;
        }

        # --- 3. OTRAS APIS (Por ahora solo Command) ---
        location /auth { 
            proxy_pass http://command_service;
            proxy_set_header Host $host;
        }

        location /users { 
            proxy_pass http://command_service;
            proxy_set_header Host $host;
        }

        # --- 4. PAGINA PRINCIPAL (Frontend HTML) ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}