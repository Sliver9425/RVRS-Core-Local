events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;

    # Nombres de los servicios definidos en tu Docker Compose
    upstream command_server { server command-service:3001; }
    upstream query_server { server query-service:3002; }
    upstream frontend_server { server frontend:3000; } # 👈 Asegurado activo

    server {
        listen 80;

        add_header X-Config-Version "v6-cqrs-local-override" always;

        # --- 1. REGLAS DE FRONTEND (Assets estáticos de Next.js) ---
        location /_next/ {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # --- 2. APIS CON LOGICA CQRS ---
        location /complaints {
            client_max_body_size 50M;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            set $upstream_target command_server;

            if ($request_method = GET) {
                set $upstream_target query_server;
            }

            proxy_pass http://$upstream_target;
        }
        
        location /auth { 
            proxy_pass http://command_server;
            proxy_set_header Host $host;
        }

        location /users { 
            proxy_pass http://command_server;
            proxy_set_header Host $host;
        }

        # --- 3. REDIRECCIÓN GENERAL DE LA APP VISUAL ---
        location / {
            proxy_pass http://frontend_server; # 👈 Todo lo que no sea API va a parar a Next.js
            proxy_set_header Host $host;
        }
    }
}