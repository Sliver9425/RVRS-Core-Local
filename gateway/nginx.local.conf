events { 
    worker_connections 1024; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # 1. CORRECCIÓN DE UPSTREAMS (Docker DNS)
    # En Docker, no usamos 127.0.0.1, usamos el nombre del servicio del docker-compose.
    
    upstream command_service { 
        server command-service:3001; 
    }
    
    upstream query_service { 
        server query-service:3002; 
    }

    # Nota: Si el frontend lo corres fuera de Docker (npm run dev), 
    # Nginx no podrá hacer proxy hacia él fácilmente. 
    # Pero no importa, porque el CORS arreglará la conexión desde el puerto 3000.

    server {
        listen 80;

        # Header para saber que cargó la config nueva
        add_header X-Config-Version "v7-local-cors-fix" always;

        # =========================================================
        # APIS CON LOGICA CQRS + CORS ENABLED
        # =========================================================
        
        location /complaints {
            # --- BLOQUE CORS (Necesario para Localhost:3000) ---
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
            # ---------------------------------------------------

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Tu lógica CQRS original
            set $upstream_target command_service;

            if ($request_method = GET) {
                set $upstream_target query_service;
            }

            proxy_pass http://$upstream_target;
        }

        # =========================================================
        # AUTH Y USUARIOS + CORS ENABLED
        # =========================================================

        location /auth { 
            # --- BLOQUE CORS ---
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            # -------------------

            proxy_pass http://command_service;
            proxy_set_header Host $host;
        }

        location /users { 
            # --- BLOQUE CORS ---
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            # -------------------

            proxy_pass http://command_service;
            proxy_set_header Host $host;
        }
    }
}