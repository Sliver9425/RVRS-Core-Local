version: '3.8'

services:
  # ==========================================
  # 1. INFRAESTRUCTURA (Bases de Datos & Mensajería)
  # ==========================================

  # Base de Datos Relacional (Command)
  postgres:
    image: postgres:15-alpine
    container_name: rvrs_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rvrs_command_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rvrs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rvrs_command_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de Datos NoSQL (Logs & Auditoría)
  mongo:
    image: mongo:6.0
    container_name: rvrs_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rvrs-network # Nota: Si deseas unificar, asegúrate de que use rvrs-network. Mantengo tu definición original.
    # Si notas problemas de red con Mongo, cámbialo a rvrs-network como los demás servicios.

  # Cache (Redis)
  redis:
    image: redis:alpine
    container_name: rvrs_redis
    ports:
      - "6379:6379"
    networks:
      - rvrs-network

  # Gestor de Colas para Notificaciones y Sync
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rvrs_rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.7"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rvrs-network

  # Kafka - Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: rvrs_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rvrs-network

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: rvrs_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # ✅ CORRECCIÓN: Separamos el listener interno (para los microservicios) del externo (por si usas herramientas fuera de Docker)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - rvrs-network

  # Interfaz gráfica Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: rvrs_kafka_ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - rvrs-network

  # ==========================================
  # 2. MICROSERVICIOS (Aplicación)
  # ==========================================

  # Command Service (Escritura)
  # Command Service (Escritura)
  command-service:
    build:
      context: .
      dockerfile: ./services/command/Dockerfile
    container_name: rvrs-command
    restart: always
    env_file:
      - ./services/command/.env
    # ✅ CORRECCIÓN WINDOWS: Anulamos el entrypoint del Dockerfile
    entrypoint: []
    # ✅ CORRECCIÓN GEN-CLIENT: Genera el cliente de Prisma para Linux y luego arranca el servicio
    
    environment:
      - PORT=3001
      - KAFKA_BROKER=kafka:9092
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - rvrs-network

  # Query Service (Lectura)
  query-service:
    build:
      context: .
      dockerfile: ./services/query/Dockerfile
    container_name: rvrs-query
    restart: always
    env_file:
      - ./services/query/.env
    # ✅ CORRECCIÓN WINDOWS: Anulamos el entrypoint del Dockerfile
    entrypoint: []
    # ✅ CORRECCIÓN GEN-CLIENT: Genera el cliente de Prisma para Linux y luego arranca el servicio
    
    environment:
      - PORT=3002
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - rvrs-network
  # Notification Service (Email/Alertas)
  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: rvrs-notification
    restart: always
    env_file:
      - ./services/notification/.env
    depends_on:
      - rabbitmq
    networks:
      - rvrs-network

  # AI Worker (Python)
  ai-worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    container_name: rvrs-ai-worker
    restart: always
    env_file:
      - ./services/ai-worker/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=complaint.received
      - KAFKA_PROCESSED_TOPIC=complaint.processed
    depends_on:
      - kafka
    networks:
      - rvrs-network
  frontend:
    build:
      context: . # 👈 Se para en la raíz para que pnpm workspaces funcione
      dockerfile: ./apps/web-portal/Dockerfile
    container_name: rvrs-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Aquí le indicamos al build de Next.js que consuma las APIs a través del Nginx local
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - rvrs-network
  # ==========================================
  # 3. GATEWAY (Nginx)
  # ==========================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: rvrs-gateway
    ports:
      - "8080:80"
    depends_on:
      - command-service
      - query-service
      - frontend
    networks:
      - rvrs-network
    volumes:
      - ./gateway/nginx.local.conf:/etc/nginx/nginx.conf:ro  

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data: 

networks:
  rvrs-network:
    driver: bridge