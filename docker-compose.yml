version: '3.8'

services:
  # ==========================================
  # 1. INFRAESTRUCTURA (Bases de Datos & Mensajería)
  # ==========================================

  # Base de Datos Relacional (Command)
  postgres:
    image: postgres:15-alpine
    container_name: rvrs_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rvrs_command_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rvrs-network

  # Base de Datos NoSQL (Logs & Auditoría)
  mongo:
    image: mongo:6.0
    container_name: rvrs_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rvrs-network

  # Cache (Redis)
  redis:
    image: redis:alpine
    container_name: rvrs_redis
    ports:
      - "6379:6379"
    networks:
      - rvrs-network

  # Kafka - Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: rvrs_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rvrs-network

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: rvrs_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - rvrs-network

  # Interfaz gráfica Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: rvrs_kafka_ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - rvrs-network

  # ==========================================
  # 2. MICROSERVICIOS (Aplicación)
  # ==========================================

  # Command Service (Escritura)
  command-service:
    # --- CAMBIO IMPORTANTE: Contexto en la Raíz ---
    build:
      context: .                          # Mira toda la carpeta rvrs-monorepo
      dockerfile: ./services/command/Dockerfile # Usa el archivo específico
    container_name: rvrs-command
    restart: always
    env_file:
      - ./services/command/.env
    environment:
      - PORT=3001
      #- DATABASE_URL=${DATABASE_URL}
      - KAFKA_BROKER=kafka:9092
      
    dns:
      - 8.8.8.8
      - 8.8.4.4  
    depends_on:
      - postgres
      - kafka
    networks:
      - rvrs-network

  # Query Service (Lectura)
  query-service:
    # --- CAMBIO IMPORTANTE: Contexto en la Raíz ---
    build:
      context: .                          # Mira toda la carpeta rvrs-monorepo
      dockerfile: ./services/query/Dockerfile # Usa el archivo específico
    container_name: rvrs-query
    restart: always
    env_file:
      - ./services/query/.env
    environment:
      #- DATABASE_URL=${DATABASE_URL}
      - PORT=3002
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
    dns:
      - 8.8.8.8
      - 8.8.4.4  
    depends_on:
      - postgres
      - kafka
      - redis
    networks:
      - rvrs-network

  # AI Worker (Python)
  ai-worker:
    # Python no necesita ver la raíz porque no usa pnpm workspaces
    build: ./services/ai-worker
    container_name: rvrs-ai-worker
    restart: always
    env_file:
      - ./services/ai-worker/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=complaint.received
      - KAFKA_PROCESSED_TOPIC=complaint.processed
    depends_on:
      - kafka
    networks:
      - rvrs-network

  # ==========================================
  # 3. GATEWAY (Nginx)
  # ==========================================
  
  gateway:
    # 1. COMENTA la imagen genérica
    # image: nginx:alpine

    # 2. AGREGA la instrucción de construir tu Dockerfile
    build:
      context: ./gateway       # Carpeta donde está el Dockerfile y nginx.conf
      dockerfile: Dockerfile

    container_name: rvrs-gateway
    ports:
      - "8080:80"

    # 3. IMPORTANTE: Comenta los volúmenes
    # Al quitar esto, obligamos a Docker a usar el archivo que copiamos 
    # dentro de la imagen. Si funciona sin esto, funcionará en AWS.
    # volumes:
    #   - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - command-service
      - query-service
    networks:
      - rvrs-network

volumes:
  postgres_data:
  mongo_data:

networks:
  rvrs-network:
    driver: bridge