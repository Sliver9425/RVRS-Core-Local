version: '3.8'

services:
  
  postgres:
    image: postgres:15-alpine
    container_name: rvrs_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rvrs_command_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rvrs-network

  
  mongo:
    image: mongo:6.0
    container_name: rvrs_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rvrs-network

  
  redis:
    image: redis:alpine
    container_name: rvrs_redis
    ports:
      - "6379:6379"
    networks:
      - rvrs-network

  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rvrs_rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rvrs-network

  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: rvrs_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rvrs-network

  
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: rvrs_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - rvrs-network

  
  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: rvrs_kafka_ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - rvrs-network

  
  command-service:
    build:
      context: .
      dockerfile: ./services/command/Dockerfile
    container_name: rvrs-command
    restart: always
    env_file:
      - ./services/command/.env
    environment:
      - PORT=3001
      - KAFKA_BROKER=kafka:9092
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - postgres
      - kafka
      - rabbitmq 
    networks:
      - rvrs-network

  
  query-service:
    build:
      context: .
      dockerfile: ./services/query/Dockerfile
    container_name: rvrs-query
    restart: always
    env_file:
      - ./services/query/.env
    environment:
      - PORT=3002
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - postgres
      - kafka
      - redis
      - rabbitmq 
    networks:
      - rvrs-network

  
  notification-service:
    build:
    
      context: ./services/notification
      
  
      dockerfile: Dockerfile
      
    container_name: rvrs-notification
    restart: always
    env_file:
      - ./services/notification/.env
    depends_on:
      - rabbitmq
    networks:
      - rvrs-network

  
  ai-worker:
    build: ./services/ai-worker
    container_name: rvrs-ai-worker
    restart: always
    env_file:
      - ./services/ai-worker/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=complaint.received
      - KAFKA_PROCESSED_TOPIC=complaint.processed
    depends_on:
      - kafka
    networks:
      - rvrs-network

  
  
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: rvrs-gateway
    ports:
      - "8080:80"
    depends_on:
      - command-service
      - query-service
    networks:
      - rvrs-network
    volumes:
      - ./gateway/nginx.local.conf:/etc/nginx/nginx.conf:ro  

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data: 
  

networks:
  rvrs-network:
    driver: bridge