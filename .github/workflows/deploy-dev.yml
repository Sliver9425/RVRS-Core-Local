name: CI/CD Pipeline DEV

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      # --- NUEVO: Obtener el ID de la cuenta actual ---
      - name: Get AWS Account ID
        id: account
        run: |
          aws sts get-caller-identity --query Account --output text > account_id.txt
          echo "id=$(cat account_id.txt)" >> $GITHUB_OUTPUT
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      # --- NUEVO: Terraform va PRIMERO para crear los repositorios ECR ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init & Apply (DEV)
        working-directory: ./infraestructure
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_ACCESS_KEY_ID_S3: ${{ secrets.B2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY_S3: ${{ secrets.B2_SECRET_KEY }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_supabase_db_url: ${{ secrets.SUPABASE_URL }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_b2_endpoint: ${{ secrets.B2_ENDPOINT }}
          TF_VAR_b2_region: ${{ secrets.B2_REGION }}
          TF_VAR_b2_key_id: ${{ secrets.B2_KEY_ID }}
          TF_VAR_b2_app_key: ${{ secrets.B2_APP_KEY }}
          TF_VAR_b2_bucket_name: ${{ secrets.B2_BUCKET_NAME }}
          TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
          TF_VAR_smtp_pass: ${{ secrets.SMTP_PASS }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="access_key=$AWS_ACCESS_KEY_ID_S3" \
            -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY_S3" \
            -backend-config="key=terraform-dev.tfstate"
          terraform apply -auto-approve -input=false

      
      - name: Login to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.account.outputs.id }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and Push with Turborepo
        env:
          ECR_URL: ${{ steps.account.outputs.id }}.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          pnpm turbo run deploy:docker --filter=...[origin/dev] --force